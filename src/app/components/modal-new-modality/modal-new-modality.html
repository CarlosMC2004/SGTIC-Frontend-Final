<div class="modal-overlay" (click)="onClose()"></div>

<div class="modal-container">

  <div class="modal-header">
    <div>
      <h2 class="modal-title">Create New Modality</h2>
      <p class="modal-subtitle">Add a new degree option to the system.</p>
    </div>
    <button class="btn-close" (click)="onClose()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="modal-body">

    <div class="form-group">
      <label>Modality Name</label>
      <input type="text"
             placeholder="Ex: Research Project..."
             [(ngModel)]="modalityName">
    </div>

    <div class="form-group">
      <label>Modality Status</label>
      <div class="status-flex">
        <div class="toggle-switch" [class.active]="modalityStatus" (click)="modalityStatus = !modalityStatus">
          <div class="toggle-circle"></div>
        </div>
        <span class="status-text" [class.active-text]="modalityStatus">
          {{ modalityStatus ? 'Active' : 'Inactive' }}
        </span>
      </div>
      <p class="helper-text">
        <span class="material-symbols-outlined icon-small">info</span>
        If active, students will be able to select it when registering their topic.
      </p>
    </div>

  </div>

  <div class="modal-footer">
    <button class="btn-cancel" (click)="onClose()">Cancel</button>
    <button class="btn-save" (click)="onSave()" [disabled]="!modalityName">
      Save Modality
    </button>
  </div>

</div>

<div class="modal-overlay" (click)="onClose()"></div>

<div class="modal-container">

  <div class="modal-header">
    <div>
      <h2 class="modal-title">Add Knowledge Area</h2>
      <p class="modal-subtitle">Register a new specialization for teachers.</p>
    </div>
    <button class="btn-close" (click)="onClose()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="modal-body">
    <div class="form-group">
      <label>Specialization Name</label>
      <input type="text"
             placeholder="Ex: Software Engineering..."
             [(ngModel)]="areaName"
             (keyup.enter)="onSave()">
      <p class="helper-text">
        <span class="material-symbols-outlined icon-small">info</span>
        This name must be unique and will appear in the teachers' profiles.
      </p>
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn-cancel" (click)="onClose()">Cancel</button>
    <button class="btn-save" (click)="onSave()" [disabled]="!areaName">
      Save Area
    </button>
  </div>

</div>

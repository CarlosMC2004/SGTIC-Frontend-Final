<div class="modal-overlay">
  <div class="modal-container">

    <div class="modal-header">
      <h2 class="modal-title">{{ titulo }}</h2>
      <button class="btn-close" (click)="onClose()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="modal-body">
      <p class="modal-description">
        {{ descripcion }}
      </p>

      <div class="form-group">
        <label for="rejection-reason">{{ labelMotivo }}</label>
        <textarea
          id="rejection-reason"
          [(ngModel)]="motivoRechazo"
          [placeholder]="placeholderMotivo"
          rows="5"></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()">Cancelar</button>
      <button class="btn-confirm-reject" (click)="onConfirm()" [disabled]="!motivoRechazo.trim()">
        <span class="material-symbols-outlined">cancel</span>
        Confirmar Rechazo
      </button>
    </div>

  </div>
</div>

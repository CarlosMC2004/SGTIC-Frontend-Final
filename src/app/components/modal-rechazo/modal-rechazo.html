<div class="modal-overlay">
  <div class="modal-container">

    <div class="modal-header">
      <h2 class="modal-title">Rechazar Solicitud</h2>
      <button class="btn-close" (click)="onClose()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="modal-body">
      <p class="modal-description">
        Indique las razones específicas por las cuales esta solicitud no cumple con los requisitos. Este mensaje será enviado al estudiante.
      </p>

      <div class="form-group">
        <label for="rejection-reason">Motivo del rechazo</label>
        <textarea
          id="rejection-reason"
          [(ngModel)]="motivoRechazo"
          placeholder="Escriba aquí las razones por las cuales se rechaza la propuesta de tesis..."
          rows="5"></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()">Cancelar</button>
      <button class="btn-confirm-reject" (click)="onConfirm()" [disabled]="!motivoRechazo.trim()">
        <span class="material-symbols-outlined">cancel</span>
        Confirmar Rechazo
      </button>
    </div>

  </div>
</div>

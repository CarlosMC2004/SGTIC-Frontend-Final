<div class="modal-overlay" (click)="closeModal()">

  <div class="modal-container" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <div>
        <h2 class="modal-title">
          {{ formData.idDocente ? 'Editar Perfil Docente' : 'Agregar Nuevo Docente' }}
        </h2>
        <p class="modal-subtitle">Actualice la información académica y credenciales</p>
      </div>
      <button class="btn-close" (click)="closeModal()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="modal-body">

      <section>
        <h3 class="section-title">
          <span class="material-symbols-outlined text-primary">person</span>
          Información Personal
        </h3>
        <div class="grid-2">
          <label class="form-group">
            <span class="label-text">Nombres</span>
            <input class="form-input" type="text" [(ngModel)]="formData.nombres" placeholder="Ej. Juan Carlos">
          </label>
          <label class="form-group">
            <span class="label-text">Apellidos</span>
            <input class="form-input" type="text" [(ngModel)]="formData.apellidos" placeholder="Ej. Pérez">
          </label>
          <label class="form-group">
            <span class="label-text">Cédula / ID</span>
            <input class="form-input" type="text" [(ngModel)]="formData.cedula">
          </label>
          <label class="form-group">
            <span class="label-text">Correo Institucional</span>
            <input class="form-input" type="email" [(ngModel)]="formData.correo">
          </label>
        </div>
      </section>

      <section>
        <h3 class="section-title">
          <span class="material-symbols-outlined text-primary">school</span>
          Información Académica
        </h3>
        <div class="space-y-6">
          <label class="form-group">
            <span class="label-text">Especialidades (Separadas por coma)</span>
            <input class="form-input" type="text" [(ngModel)]="formData.especialidades" placeholder="Ej. Ingeniería de Software, IA">
          </label>
        </div>
      </section>

    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeModal()">Cancelar</button>
      <button class="btn-save" (click)="guardarDatos()">Guardar Cambios</button>
    </div>

  </div>
</div>

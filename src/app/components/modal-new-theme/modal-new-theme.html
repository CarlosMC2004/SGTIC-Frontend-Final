<div class="modal-overlay">
  <div class="modal-card">

    <div class="modal-header">
      <h2 class="title">Registrar Nuevo Tema</h2>
      <button class="btn-close" (click)="onClose()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="modal-body">

      <div class="form-group">
        <label>Título</label>
        <input type="text" placeholder="Ej. Implementación de IA en procesos de manufactura">
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea
          placeholder="Resumen detallado del proyecto, objetivos principales y alcance esperado..."
          rows="5"></textarea>
      </div>

      <div class="form-group">
        <label>Tipo de titulación</label>
        <div class="select-wrapper">
          <select>
            <option value="" disabled selected>Selecciona el tipo de titulación</option>
            <option value="ing-sistemas">Proyecto investigativo</option>
            <option value="ing-industrial">Proyecto tecnológico</option>
          </select>
          <span class="material-symbols-outlined arrow-icon">expand_more</span>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()">Cancelar</button>

      <button class="btn-save">
        Guardar Tema
      </button>
    </div>

  </div>
</div>

<div class="modal-backdrop" (click)="cerrarModal()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h2>Actualización de Datos y Hoja de Vida</h2>
      <button class="btn-close" (click)="cerrarModal()"><span class="material-symbols-outlined">close</span></button>
    </div>

    <div class="modal-body scrollable">
      
      <div class="section-box">
        <h3 class="section-title">Subir foto de perfil</h3>
        <div class="file-upload-container">
          <label class="required-label">Seleccione Imagen <span class="text-danger">*</span></label>
          <div class="upload-controls">
            <button type="button" class="btn-select-file" (click)="fileInput.click()">
              <span class="material-symbols-outlined">cloud_upload</span> Seleccionar
            </button>
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/png, image/jpeg, image/jpg" style="display: none;">
            
            <p class="file-hint">
              <span class="material-symbols-outlined icon-tiny">info</span> 
              Tamaño Máximo permitido 500Kb, en formato png, jpg, jpeg
            </p>
            <p class="file-name" *ngIf="selectedFileName">Archivo seleccionado: <strong>{{ selectedFileName }}</strong></p>
          </div>
        </div>
      </div>

      <div class="section-box">
        <h3 class="section-title">Datos de su residencia y contacto</h3>
        
        <form [formGroup]="resumeForm" class="form-grid">
          
          <div class="form-group">
            <label>País <span class="text-danger">*</span></label>
            <select formControlName="pais">
              <option value="ECUADOR">ECUADOR</option>
            </select>
          </div>

          <div class="form-group">
            <label>Provincia <span class="text-danger">*</span></label>
            <select formControlName="provincia">
              <option value="LOS RIOS">LOS RIOS</option>
            </select>
          </div>

          <div class="form-group">
            <label>Cantón <span class="text-danger">*</span></label>
            <select formControlName="canton">
              <option value="QUEVEDO">QUEVEDO</option>
            </select>
          </div>

          <div class="form-group">
            <label>Parroquia <span class="text-danger">*</span></label>
            <select formControlName="parroquia">
              <option value="" disabled selected>Seleccione...</option>
              <option value="SAN CAMILO">SAN CAMILO</option>
              <option value="NICOLAS INFANTE DIAZ">NICOLAS INFANTE DIAZ</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label>Calle principal <span class="text-danger">*</span></label>
            <input type="text" formControlName="direccionPrincipal" placeholder="Ej. Av. Principal">
          </div>

          <div class="form-group full-width">
            <label>Calle secundaria</label>
            <input type="text" formControlName="direccionSecundaria">
          </div>

          <div class="form-group">
            <label>Teléfono celular <span class="text-danger">*</span></label>
            <input type="text" formControlName="telefonoCelular" placeholder="09XXXXXXXX" maxlength="10">
          </div>

          <div class="form-group">
            <label>Teléfono domicilio</label>
            <input type="text" formControlName="telefonoFijo">
          </div>

        </form>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn-guardar" (click)="guardar()" [disabled]="resumeForm.invalid || !selectedFile">
        Guardar
      </button>
      <button class="btn-cancelar" (click)="cerrarModal()">
        Cancelar
      </button>
    </div>

  </div>
</div>

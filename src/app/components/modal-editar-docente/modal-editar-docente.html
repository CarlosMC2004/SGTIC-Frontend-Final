<div class="modal-overlay" (click)="closeModal()"></div>

<div class="modal-container">

  <div class="modal-header">
    <div>
      <h2 class="modal-title">Editar Perfil Docente</h2>
      <p class="modal-subtitle">Actualice la información académica y credenciales</p>
    </div>
    <button class="btn-close" (click)="closeModal()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="modal-body">

    <section>
      <h3 class="section-title">
        <span class="material-symbols-outlined text-primary">person</span>
        Información Personal
      </h3>
      <div class="grid-2">
        <label class="form-group">
          <span class="label-text">Nombres</span>
          <input class="form-input" type="text" value="">
        </label>
        <label class="form-group">
          <span class="label-text">Apellidos</span>
          <input class="form-input" type="text" value="">
        </label>
        <label class="form-group">
          <span class="label-text">Cédula / ID</span>
          <input class="form-input" type="text" value="">
        </label>
        <label class="form-group">
          <span class="label-text">Correo Institucional</span>
          <input class="form-input" type="email" value="">
        </label>
      </div>
    </section>

    <section>
      <h3 class="section-title">
        <span class="material-symbols-outlined text-primary">school</span>
        Información Académica
      </h3>
      <div class="space-y-6">
        <label class="form-group max-w-md">
          <span class="label-text">Título de 4to Nivel</span>
          <label class="form-group">
            <input class="form-input" type="text">
          </label>
        </label>

        <div class="toggle-card">
          <div class="flex-col">
            <span class="toggle-title">Es Investigador</span>
            <span class="toggle-subtitle">Habilitar funciones de investigación</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" [checked]="teacherData?.isInvestigator" class="sr-only custom-toggle">
            <div class="toggle-bg">
              <div class="toggle-circle"></div>
            </div>
          </label>
        </div>
      </div>
    </section>

  </div>

  <div class="modal-footer">
    <button class="btn-cancel" (click)="closeModal()">Cancelar</button>
    <button class="btn-save">Guardar Cambios</button>
  </div>

</div>

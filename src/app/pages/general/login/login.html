<app-auth-layout>
  <div class="login-container">
    
    <p class="subtitle">Ingrese sus credenciales institucionales para continuar.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="username">Correo Institucional</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="username" 
            formControlName="username" 
            placeholder="ej. estudiante@uteq.edu.ec"
            [class.error]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
          >
          <span class="icon">✉️</span> </div>
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error-msg">
          Correo requerido
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            formControlName="password" 
            placeholder="........"
          >
          <span class="icon clickable" (click)="togglePassword()">
            {{ showPassword ? '👁️' : '🔒' }}
          </span>
        </div>
      </div>

      <div class="forgot-pass">
        <a routerLink="/auth/forgot-password">¿Olvidó su contraseña?</a>
      </div>

      <button type="submit" class="btn-login">
        Iniciar Sesión
      </button>

    </form>

    <div class="footer-links">
      <p>Inicia tu proceso de titulación <a href="#">Solicita acceso</a></p>
    </div>
  </div>
</app-auth-layout>

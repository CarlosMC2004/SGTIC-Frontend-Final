<div class="layout-wrapper">
  
  <app-sidebar role="coordinador"></app-sidebar>

  <main class="main-content">
    
    <header class="top-bar">
      <div class="search-box">
        <span class="material-symbols-outlined">search</span>
        <input type="text" placeholder="Search for students, thesis, or documents...">
      </div>
      
      <div class="user-profile">
        <img src="https://i.pravatar.cc/150?u=admin" alt="Admin Profile">
      </div>
    </header>

    <section class="dashboard-header">
      <div class="header-titles">
        <h2>Admin Dashboard</h2>
        <p>Manage users, faculty settings and system configurations.</p>
      </div>
      <button class="btn-create">
        Create New User
      </button>
    </section>

    <section class="card table-card">
      <div class="card-header">
        <h3>Recent Users</h3>
        <div class="dots-menu">
          <span></span><span></span>
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>USER</th>
              <th>ROLE</th>
              <th>STATUS</th>
              <th>LAST LOGIN</th>
              <th>ACTIONS</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of recentUsers">
              <td>
                <div class="user-info">
                  <div class="avatar-circle" [style.background-color]="user.color">
                    {{ user.initial }}
                  </div>
                  <div class="user-details">
                    <span class="name">{{ user.name }}</span>
                    <span class="email">{{ user.email }}</span>
                  </div>
                </div>
              </td>
              <td>
                <span class="role-badge" [ngClass]="getRoleClass(user.role)">
                  {{ user.role }}
                </span>
              </td>
              <td>
                <div class="status-indicator">
                  <span class="dot" [class.active]="user.status === 'Active'"></span>
                  <span class="status-text">{{ user.status }}</span>
                </div>
              </td>
              <td class="text-muted">{{ user.lastLogin }}</td>
              <td>
                </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="master-data-section">
      <h3>Master Data & Configuration</h3>
      
      <div class="cards-grid">
        <div class="config-card" *ngFor="let item of masterConfigs">
          <div class="card-icon-box">
             </div>
          <span class="card-title">{{ item.title }}</span>
        </div>
      </div>
    </section>

  </main>
</div>

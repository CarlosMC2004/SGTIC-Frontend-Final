<app-glass-modal [isVisible]="isModalVisible" (closeEvent)="toggleModal()">
  <div header class="modal-header-content">
    <div class="icon-box">
      <span class="material-symbols-outlined">school</span>
    </div>
    <h2>New Career</h2>
  </div>

  <form [formGroup]="careerForm" (ngSubmit)="onSubmit()" class="career-form">
    
    <div class="form-row">
      <div class="form-group full-width">
        <label for="name">NAME</label>
        <input type="text" id="name" formControlName="name" placeholder="e.g. Software Engineering">
      </div>
    </div>

    <div class="form-group">
      <label for="faculty">FACULTY</label>
      <div class="select-wrapper">
        <select id="faculty" formControlName="facultyId">
          <option value="" disabled selected>Select a faculty</option>
          <option *ngFor="let faculty of facultyList" [value]="faculty.id">
            {{ faculty.name }}
          </option>
        </select>
        <span class="material-symbols-outlined select-icon">expand_more</span>
      </div>
    </div>

    <div class="form-group">
      <label for="description">DESCRIPTION</label>
      <textarea id="description" formControlName="description" rows="3" 
        placeholder="Brief description of the career profile..."></textarea>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="toggleModal()">Cancel</button>
      <button type="submit" class="btn-save" [disabled]="careerForm.invalid">Save</button>
    </div>
  </form>
</app-glass-modal>

<div class="layout-container">

  <app-sidebar role="coordinador"></app-sidebar>

  <div class="main-wrapper">
    <app-topbar></app-topbar>

    <main class="content-area">

      <div class="page-header">
        <h2 class="page-title">Directorio de Docentes e Investigadores</h2>

        <button class="btn-add-teacher" (click)="editarDocente(null)">
          <span class="material-symbols-outlined">add</span>
          Agregar Docente
        </button>
      </div>

      <div class="filters-bar">

        <div class="search-input">
          <span class="material-symbols-outlined icon">search</span>
          <input type="text"
                 [(ngModel)]="terminoBusqueda"
                 (input)="aplicarFiltros()"
                 placeholder="Buscar por nombre o email..."
                 class="search-input-field">
        </div>

        <div class="filters-actions">
          <div class="select-wrapper">
            <select class="custom-select" [(ngModel)]="filtroEstado" (change)="aplicarFiltros()">
              <option value="todos">Todos los Estados</option>
              <option value="activo">Solo Activos</option>
              <option value="inactivo">Solo Inactivos</option>
            </select>
            <span class="material-symbols-outlined select-icon">expand_more</span>
          </div>

        </div>
      </div>

      <div class="teachers-grid" *ngIf="!cargando && teachers.length > 0">
        <div class="teacher-card" *ngFor="let t of teachers" [class.inactive-card]="!t.activo">

          <div class="card-top">
            <div class="avatar-circle">
              <span>{{ t.nombreCompleto?.charAt(0) }}</span>
            </div>

            <div class="status-toggle">
              <span class="label-status">{{ t.activo ? 'ACTIVO' : 'INACTIVO' }}</span>
              <label class="switch">
                <input type="checkbox" [(ngModel)]="t.activo" (change)="cambiarEstado(t)">
                <span class="slider round"></span>
              </label>
            </div>
          </div>

          <div class="teacher-info">
            <h3>{{ t.nombreCompleto }}</h3>
            <p>{{ t.correo }}</p>
          </div>

          <div class="badges">
            <span class="badge" *ngFor="let esp of t.especialidades">{{ esp }}</span>
            <span class="badge-empty" *ngIf="t.especialidades.length === 0">Sin especialidad</span>
          </div>

          <div class="card-footer">
            <button class="btn-edit" (click)="editarDocente(t)">
              <span class="material-symbols-outlined">edit</span> Editar Perfil
            </button>
            <span class="link-history">Ver Proyectos</span>
          </div>
        </div>

      </div>
      <div *ngIf="teachers.length === 0 && !cargando" class="no-data">
        <p>No se encontraron docentes.</p>
      </div>

    </main>

    <app-modal-edit-teacher
      *ngIf="selectedTeacher"
      [teacherData]="selectedTeacher"
      (close)="closeEditModal()"
      (save)="guardarDocente($event)">
    </app-modal-edit-teacher>

  </div>
</div>

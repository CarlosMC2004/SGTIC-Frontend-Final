<div class="layout-container">

  <app-sidebar role="coordinador"></app-sidebar>

  <div class="main-wrapper">

    <app-header></app-header>

    <main class="content-area">

      <div class="page-header">
        <h2 class="page-title">Directorio de Docentes e Investigadores</h2>
      </div>

      <div class="filters-bar">

        <div class="search-input">
          <span class="material-symbols-outlined icon">search</span>
          <input type="text"
                 [(ngModel)]="terminoBusqueda"
                 (ngModelChange)="onFiltroChange()"
                 placeholder="Buscar por nombre o email..."
                 class="search-input-field">
        </div>

        <div class="filters-actions">

          <button class="btn-filter">
            Tipo de Contrato <span class="material-symbols-outlined">expand_more</span>
          </button>

          <div class="select-wrapper">
            <select class="custom-select" [(ngModel)]="filtroEspecialidad" (change)="onFiltroChange()">
              <option value="todos">Todas las Especialidades</option>
              <option *ngFor="let esp of especialidades" [value]="esp">
                {{ esp }}
              </option>
            </select>
            <span class="material-symbols-outlined select-icon">expand_more</span>
          </div>

          <div class="select-wrapper">
            <select class="custom-select" [(ngModel)]="filtroDisponibilidad" (change)="onFiltroChange()">
              <option value="todos">Todas las Disponibilidades</option>
              <option value="disponible">Disponibles</option>
              <option value="lleno">No Disponibles</option>
            </select>
            <span class="material-symbols-outlined select-icon">expand_more</span>
          </div>

        </div>
      </div>

      <div class="teachers-grid">

        <div class="teacher-card" *ngFor="let t of teachers">

          <div class="card-top">
            <div class="avatar-circle">
              <span>{{ t.fullName.charAt(0) }}</span>
            </div>

            <div class="status-toggle">
              <span class="label-inv">INV.</span>
              <div class="toggle-switch" [class.active]="t.isResearcher">
                <div class="toggle-circle"></div>
              </div>
            </div>
          </div>

          <div class="teacher-info">
            <h3>{{ t.fullName }}</h3>
            <p>{{ t.email }}</p>
          </div>

          <div class="badges">
            <span class="badge">{{ t.degree }}</span>
            <span class="badge">{{ t.contract }}</span>
          </div>

          <div class="workload-section">
            <div class="workload-header">
              <span>CARGA DE TESIS</span>
              <span>{{ t.workload }} / 5</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill"
                   [style.width]="getWorkloadPercentage(t.workload)"
                   [style.background-color]="getProgressBarColor(t.workload)">
              </div>
            </div>
          </div>

          <div class="card-footer">
            <a class="link-edit" (click)="editarDocente(t)">Editar Perfil</a>
            <span class="link-history">Historial</span>
          </div>
        </div>

      </div>
      <div *ngIf="teachers.length === 0 && !cargando" class="no-data">
        <p>No se encontraron docentes con esos criterios.</p>
      </div>

    </main>

    <app-modal-edit-teacher
      *ngIf="selectedTeacher"
      [teacherData]="selectedTeacher"
      (close)="closeEditModal()">
    </app-modal-edit-teacher>

  </div>
</div>
